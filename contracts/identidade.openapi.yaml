openapi: 3.0.3
info:
  title: NexFleet - autenticação interna
  version: 0.3.0
  description: API interna de Identidade, consumida pelo BFF através do contrato auth-web. Não exposta diretamente pelo Gateway. Sem refresh ou autorização por perfis.
paths:
  /.well-known/jwks.json:
    get:
      operationId: consultarChavesPublicas
      description: Disponível somente com perfil jwt-rsa, dentro da rede interna. Não exposto pelo Gateway. Não contém material privado.
      responses:
        '200':
          description: Chave pública de assinatura RS256
          content:
            application/json:
              schema:
                type: object
                required: [keys]
                properties:
                  keys:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items:
                      type: object
                      additionalProperties: false
                      required: [kty, use, kid, alg, n, e]
                      properties:
                        kty: {type: string, enum: [RSA]}
                        use: {type: string, enum: [sig]}
                        kid: {type: string}
                        alg: {type: string, enum: [RS256]}
                        n: {type: string}
                        e: {type: string}
  /api/v1/identidade/login:
    post:
      operationId: autenticar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email: {type: string, maxLength: 254}
                senha: {type: string, format: password, description: Máximo 72 bytes UTF-8}
      responses:
        '200':
          description: Token de acesso; Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, tokenType, expiresIn]
                properties:
                  accessToken: {type: string}
                  tokenType: {type: string, enum: [Bearer]}
                  expiresIn: {type: integer, enum: [900]}
        '400': {description: JSON inválido}
        '401': {description: Credenciais inválidas (inclui usuário ausente ou inativo)}
  /api/v1/identidade/me:
    get:
      operationId: consultarIdentidadeAutenticada
      security: [{bearerAuth: []}]
      responses:
        '200':
          description: Identificador autenticado
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id: {type: string, format: uuid}
                  perfil: {type: string, enum: [ADMINISTRADOR, GESTOR_FROTA]}
        '401': {description: Token ausente ou inválido}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
