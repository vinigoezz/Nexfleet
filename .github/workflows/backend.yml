name: Backend - NexFleet
on:
  push:
    paths: ['services/**', 'functions/**', 'contracts/**', 'quality/**', 'infra/**', 'scripts/**', 'compose*.yaml', '.env.sprint0.example', '.github/workflows/backend.yml']
  pull_request:
    paths: ['services/**', 'functions/**', 'contracts/**', 'quality/**', 'infra/**', 'scripts/**', 'compose*.yaml', '.env.sprint0.example', '.github/workflows/backend.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validar template de pré-publicação Azure
        shell: pwsh
        run: ./scripts/Test-AzurePreflight.ps1 -TemplateOnly
      - name: Validar descoberta Azure offline
        shell: pwsh
        run: ./scripts/Get-AzureReadiness.ps1 -ValidateOnly
      - name: Instalar Bicep 0.49.2 com checksum
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/Azure/bicep/releases/download/v0.49.2/bicep-linux-x64 \
            --output /tmp/bicep
          echo "0ab9de90c2493f206f8281bae74f9ee2d5ed3605548dab1adf41fef185e1f7c5  /tmp/bicep" | sha256sum --check
          chmod +x /tmp/bicep
      - name: Compilar e validar infraestrutura Bicep
        shell: pwsh
        run: ./scripts/Test-AzureInfrastructure.ps1 -BicepPath /tmp/bicep
      - run: mvn --batch-mode --no-transfer-progress -f quality/pom.xml verify
      - run: mvn --batch-mode --no-transfer-progress -f services/pom.xml verify
      - name: Provar CQ03 e CQ04 em PostgreSQL temporário
        shell: pwsh
        run: ./scripts/Test-Cq03Cq04.ps1
      - name: Provar CQ05 em bancos PostgreSQL temporários
        shell: pwsh
        run: ./scripts/Test-Cq05.ps1
      - name: Provar CQ07 com falha controlada do banco
        shell: pwsh
        run: ./scripts/Test-Cq07.ps1
      - run: mvn --batch-mode --no-transfer-progress -f functions/notificar-abastecimento/pom.xml verify
      - run: docker compose --env-file .env.sprint0.example -f compose.sprint0.yaml config --quiet
      - run: docker compose --env-file .env.sprint0.example -f compose.sprint0.yaml -f compose.jwt-rsa.yaml config --quiet
      - run: IDENTIDADE_PROFILES=local-seed,jwt-rsa docker compose --env-file .env.sprint0.example -f compose.sprint0.yaml -f compose.sprint1-local.yaml -f compose.jwt-rsa.yaml config --quiet
