spring.application.name=nexfleet-indicadores
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5p service=${spring.application.name} correlationId=%X{correlationId:-none} logger=%logger{36} message=%m%n%wEx
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.error.include-message=never
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.schemas=indicadores
spring.flyway.default-schema=indicadores
management.endpoint.health.group.readiness.include=readinessState,db
nexfleet.messaging.provider=${MESSAGING_PROVIDER:rabbit}
nexfleet.servicebus.fully-qualified-namespace=${SERVICEBUS_FULLY_QUALIFIED_NAMESPACE:}
nexfleet.servicebus.topic=${SERVICEBUS_TOPIC:nexfleet-eventos-v1}
nexfleet.servicebus.subscription=${SERVICEBUS_INDICADORES_SUBSCRIPTION:indicadores-v1}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:nexfleet}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
nexfleet.eventos.exchange=nexfleet.eventos
nexfleet.eventos.abastecimento-routing-key=operacoes.abastecimento.registrado.v1
nexfleet.eventos.manutencao-routing-key=operacoes.manutencao.registrada.v1
nexfleet.eventos.indicadores-queue=nexfleet.indicadores.projecao-abastecimentos.v1.com-dlq
nexfleet.eventos.dlx=nexfleet.eventos.dlx
nexfleet.eventos.indicadores-dlq=nexfleet.indicadores.projecao-abastecimentos.v1.dlq
nexfleet.eventos.indicadores-dlq-routing-key=indicadores.abastecimento-registrado.falha.v1
nexfleet.eventos.manutencao-indicadores-queue=nexfleet.indicadores.projecao-manutencoes.v1.com-dlq
nexfleet.eventos.manutencao-indicadores-dlq=nexfleet.indicadores.projecao-manutencoes.v1.dlq
nexfleet.eventos.manutencao-indicadores-dlq-routing-key=indicadores.manutencao-registrada.falha.v1
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=500ms
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=2s
spring.rabbitmq.listener.simple.default-requeue-rejected=false
services.identidade.url=${IDENTIDADE_URL:http://localhost:8081}
