spring.application.name=nexfleet-bff
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5p service=${spring.application.name} correlationId=%X{correlationId:-none} logger=%logger{36} message=%m%n%wEx
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.error.include-message=never
services.identidade.url=${IDENTIDADE_URL:http://localhost:8081}
services.frota.url=${FROTA_URL:http://localhost:8082}
services.operacoes.url=${OPERACOES_URL:http://localhost:8083}
services.indicadores.url=${INDICADORES_URL:http://localhost:8084}
