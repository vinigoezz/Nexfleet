spring.application.name=nexfleet-identidade
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5p service=${spring.application.name} correlationId=%X{correlationId:-none} logger=%logger{36} message=%m%n%wEx
auth.jwt.secret=${JWT_SECRET}
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.error.include-message=never
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.schemas=identidade
spring.flyway.default-schema=identidade
management.endpoint.health.group.readiness.include=readinessState,db
