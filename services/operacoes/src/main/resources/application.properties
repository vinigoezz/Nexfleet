spring.application.name=nexfleet-operacoes
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5p service=${spring.application.name} correlationId=%X{correlationId:-none} logger=%logger{36} message=%m%n%wEx
server.port=${PORT:8080}
management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
server.error.include-message=never
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.schemas=operacoes
spring.flyway.default-schema=operacoes
management.endpoint.health.group.readiness.include=readinessState,db
services.identidade.url=${IDENTIDADE_URL:http://localhost:8081}
services.frota.url=${FROTA_URL:http://localhost:8082}
nexfleet.messaging.provider=${MESSAGING_PROVIDER:rabbit}
nexfleet.servicebus.fully-qualified-namespace=${SERVICEBUS_FULLY_QUALIFIED_NAMESPACE:}
nexfleet.servicebus.topic=${SERVICEBUS_TOPIC:nexfleet-eventos-v1}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:nexfleet}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
nexfleet.eventos.exchange=nexfleet.eventos
nexfleet.eventos.abastecimento-routing-key=operacoes.abastecimento.registrado.v1
nexfleet.eventos.manutencao-routing-key=operacoes.manutencao.registrada.v1
outbox.publicacao.intervalo-ms=1000
outbox.publicacao.atraso-inicial-ms=3000
outbox.publicacao.lote=20
outbox.publicacao.retry-segundos=5
